[project]
name = "kaggriculture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Douglas Sgrott", email = "doug.sgrott@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle-environments>=1.32.7",
    "kaggle-wiki-kit",
]

[project.scripts]
kaggriculture = "kaggriculture:main"

# Switched from uv_build (pure-Python only) to setuptools + pybind11 in issue 009: the C++ sim
# needs a compiled extension (src/kaggriculture/sim/_sim_native), and this machine has no cmake
# -- pybind11.setup_helpers.Pybind11Extension builds via plain setuptools/g++, no cmake needed.
# See setup.py for the extension definition; `uv sync` / `uv build` drive it automatically via
# the standard PEP 517 build_ext hook, same as any other compiled-extension package.
[build-system]
requires = ["setuptools>=69", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
kaggle-wiki-kit = { path = "../kaggle-wiki-kit", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Issue 010: the full parity sweep (>=200 episodes against the real engine) takes minutes, not
# seconds, dominated by the real engine's own per-episode cost -- skip it by default so `uv run
# pytest` stays fast, and require an explicit opt-in for the thing that's actually the gate.
[tool.pytest.ini_options]
markers = [
    "slow: multi-minute tests (the full parity sweep); opt in with `pytest -m slow`",
]
addopts = "-m 'not slow'"
